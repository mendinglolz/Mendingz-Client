name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p src/main/java/com/mendingz/client/gui src/main/java/com/mendingz/client/module src/main/resources
          mv MendingzClient.java src/main/java/com/mendingz/client/
          mv MendingzHud.java ClickGuiScreen.java src/main/java/com/mendingz/client/gui/
          mv Module.java ModuleManager.java Setting.java src/main/java/com/mendingz/client/module/
          mv fabric.mod.json src/main/resources/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mendingz-jar
          path: build/libs/*.jar
